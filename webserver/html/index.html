<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Simple Webpage</title>

    <!-- Montserrat Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>

<body>
    <div class="grid-container">
        <!-- Header Section -->
        <header class="header">
            <div class="menu-icon" onclick="openSidebar()">
                <span class="material-icons-outlined">menu</span>
            </div>
            <div class="header-right">
                <div class="header-cards">
                    <div class="header-card">
                        <span class="material-icons-outlined" id="lan-symbol">lan</span>
                        <span class="material-icons-outlined" id="sensor-symbol">developer_board</span>
                    </div>
                </div>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-title">
                <div class="sidebar-brand">
                    <span class="material-icons-outlined">electric_bike</span> BikeMonitor
                </div>
            </div>
            <ul class="sidebar-list">
                <li class="sidebar-list-item">
                    <span class="material-icons-outlined">dashboard</span> Dashboard
                </li>
                <li class="sidebar-list-item">
                    <span class="material-icons-outlined">settings</span> Settings
                </li>
            </ul>
        </aside>
        <!-- Main -->
        <main class="main-container">
            <div class="main-title">
                <p class="font-weight-bold">BIKE</p>
            </div>

            <div class="main-cards" id="clients-container">
                <!-- Dynamically generated cards will be added here -->
            </div>

            <div class="main-title" style="margin-top: 30px;">
                <p class="font-weight-bold">TRAINING</p>
            </div>
            <div class="main-cards" id="training-container">
                <!-- HR training card will be added here -->
            </div>

            <div class="main-title">
                <p class="font-weight-bold">TIMESERIES</p>
            </div>
            <div class="chart-container">
                <div id="charts-container">
                    <div>
                        <canvas id="bike-Chart"></canvas>
                    </div>
                    <div>
                        <canvas id="interval-plot"></canvas>
                    </div>
                    <div>
                        <canvas id="step-plot"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="script.js"></script>
</body>

</html>
